<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知序 · Python 学习花园</title><style>:root{--ink:#213c34;--muted:#6b7c73;--green:#327356;--line:#dce4db;--bg:#f7f8f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 system-ui,-apple-system,sans-serif}aside{position:fixed;width:252px;height:100vh;padding:32px 24px;background:#eaf0e6;overflow:auto;border-right:1px solid var(--line)}.brand{font-size:30px;font-weight:750;color:var(--ink);text-decoration:none}.brand span{display:block;font-size:9px;letter-spacing:2px}aside p,small{font-size:12px;color:var(--muted)}nav button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent}button{border:1px solid var(--line);border-radius:8px;background:white;padding:10px 16px;color:var(--ink);cursor:pointer;font:inherit;font-size:14px}button:hover,button.active{background:#d8e7d5}button.primary{background:var(--green);color:white}button:disabled{opacity:.5;cursor:wait}.import{display:block;cursor:pointer;font-size:13px;margin:16px 0}.import input{width:180px;font-size:11px}main{margin-left:252px;padding:28px 6%;max-width:1400px}header{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:20px}h1{font-size:42px;line-height:1.3;letter-spacing:-1px;margin:24px 0}h2{font-size:24px}h3{font-size:18px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:2px;margin-top:35px}.intro{max-width:680px;color:var(--muted)}.hero{padding:20px 0 35px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin:16px 0}.card p{color:var(--muted)}.number{color:#8ca58e;font-size:13px;letter-spacing:2px}.tag{font-size:12px;color:var(--green)}pre,textarea{font:14px/1.7 ui-monospace,Menlo,monospace;background:#172d27;color:#e1eedc;border-radius:9px;padding:20px;overflow:auto;white-space:pre-wrap}textarea{width:100%;min-height:230px;resize:vertical;border:1px solid #507163;tab-size:4}pre{margin:15px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.result{white-space:pre-wrap;font:13px/1.7 ui-monospace,monospace}.note{padding:18px;border-left:3px solid #8da889;background:#eef3e9;font-size:14px}footer{font-size:12px;color:var(--muted);padding:40px 0}a{color:var(--green)}progress{width:100%;accent-color:var(--green)}details{margin:15px 0}summary{cursor:pointer}#timer{font-weight:bold;color:#9b5c29}@media(max-width:750px){aside{position:static;width:auto;height:auto;padding:20px}nav{display:flex;flex-wrap:wrap}nav button{width:auto}aside small,.import{display:none}main{margin:0;padding:20px}h1{font-size:32px}.grid{grid-template-columns:1fr}}
</style><body><aside><a class="brand" href="#">知序<span>PYTHON LEARNING GARDEN</span></a><p>一点一点，建立真正的能力。</p><nav id="nav"></nav><button id="export">导出学习备份 ↗</button><label class="import">导入备份<input id="import" type="file" accept=".json"></label><small>答案仅存于当前浏览器。换设备或清理浏览器前，请导出备份。</small></aside><main><header><span>你的开发者成长路径</span><span id="save">本地自动保存</span></header><div id="view"></div><footer>不赶进度，检查理解。每次只解决一个问题。</footer></main><script>'use strict';
let course=[],state={answers:{},scores:{},read:{},exams:{}},page='home',worker=null,busy=false,watchdog,idle;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const v=JSON.parse(localStorage.getItem('zhixu-v1'));if(v&&v.answers&&v.scores&&v.read&&v.exams)state=v;}catch{}
function save(){try{localStorage.setItem('zhixu-v1',JSON.stringify(state));$('#save').textContent='已保存 · '+new Date().toLocaleTimeString();}catch{$('#save').textContent='保存失败，请立即导出备份';}}
function stop(){if(worker)worker.terminate();worker=null;busy=false;clearTimeout(watchdog);clearTimeout(idle);document.querySelectorAll('.run').forEach(b=>b.disabled=false)}
function nav(){let items=[['home','◉ 学习总览'],['path','↗ 成长路线'],['exam','◇ 阶段考试']];$('#nav').innerHTML=items.map(([id,t])=>`<button data-page="${id}" class="${page===id?'active':''}">${t}</button>`).join('')+'<small>课程目录 · 12 章</small>'+course.map((c,i)=>`<button data-page="${i}" class="${page===String(i)?'active':''}">${String(i+1).padStart(2,'0')} ${esc(c.title)}</button>`).join('');}
function go(p){stop();page=String(p);render();window.scrollTo(0,0)}
function taskHTML(t,key=t.id,exam=false){return `<section class="card"><span class="tag">${exam?'考试题':'动手练习'} · ${esc(key)}</span><h3>${esc(t.prompt)}</h3><p>实现 solve(${t.arg})。返回结果，不要用 input()。输入类型以示例为准。</p><pre>输入：${esc(JSON.stringify(t.cases[0][0]))}\n输出：${esc(JSON.stringify(t.cases[0][1]))}</pre><textarea spellcheck="false" aria-label="${esc(t.prompt)}代码" data-key="${key}">${esc(state.answers[key]??t.starter)}</textarea><div class="actions"><button class="primary run" data-run="${key}">${exam?'提交并批改此题':'运行与批改'}</button><button data-stop="${key}">停止运行</button></div><div class="result" id="r-${key}" aria-live="polite">${state.scores[key]===undefined?'还未提交':`最近成绩：${state.scores[key]}%`}</div>${exam?'':`<details><summary>参考思路与答案（先独立尝试）</summary><p>先手算一个普通输入，再检查空输入和边界；逐行跟踪变量变化。</p><pre>${esc(t.solution)}</pre></details>`}</section>`;}
function examTasks(n){return [course[n*4+1].tasks[1],course[n*4+3].tasks[0]].map((t,i)=>({...t,id:`e${n}-${i}`}));}
function render(){nav();let html='';if(page==='home'){let passed=Object.values(state.scores).filter(x=>x===100).length;html=`<div class="hero"><div class="eyebrow">从第一行代码，到独立解决问题</div><h1>慢慢学，<br>把基础长扎实。</h1><p class="intro">为有一点 C++ 基础的你设计。用零散的 25 分钟，积累 Python、互联网开发与智能应用的基本功。</p><div class="actions"><button class="primary" data-page="${course.findIndex((_,i)=>!state.read[i])===-1?0:course.findIndex((_,i)=>!state.read[i])}">继续今天的学习 →</button><button data-page="path">查看完整路线</button></div></div><div class="grid"><div class="card"><span class="number">12 章 · 24 道编程题</span><h2>先理解，再写出来</h2><p>已通过 ${passed} 次题目记录（含考试题）。阅读完成不等于掌握。</p></div><div class="card"><span class="number">25 分钟 / 一次</span><h2>适合零散时间</h2><p>5 分钟回忆 → 10 分钟阅读 → 10 分钟写题。第二天合上答案重写。</p></div></div><h2>你的课程</h2><div class="grid">${course.map((c,i)=>`<article class="card"><span class="number">CHAPTER ${String(i+1).padStart(2,'0')} · ${state.read[i]?'已阅读':'待学习'}</span><h3>${c.title}</h3><p>${c.body.slice(0,65)}…</p><button data-page="${i}">进入章节 →</button></article>`).join('')}</div>`;}
else if(page==='path'){html=`<div class="eyebrow">学习路线 / 按掌握程度推进</div><h1>把目标拆成可验证的能力。</h1><div class="note">建议总投入 180–260 小时，包括反复练习和项目。网页是起步教材与练习场，不是完整职业培训；完成题目后还要独立做项目。</div>${[['01—04','语言基础 · 30–40 小时','变量、分支、循环、序列与映射。每题手算三个输入，说明为什么正确；通过第一次考试。'],['05—08','可靠程序 · 40–60 小时','函数、异常、类与基础算法。能读懂 traceback，能解释列表共享和 O(n)；通过第二次考试。'],['09—12','应用入门 · 40–60 小时','HTTP、数据库、测试、生成器与并发。网页练习覆盖核心逻辑，真实服务器、Git、数据库工程需再做实践；通过第三次考试。'],['PROJECT','独立项目 · 70–100 小时','智能教师：题库、判分、错题复习、SQLite、FastAPI 接口及测试。机器人：网格地图、障碍物、BFS 路径规划、动作日志及模拟测试；之后学 ROS 2、线性代数和控制基础。']].map(([a,b,c])=>`<div class="card"><span class="number">${a}</span><h2>${b}</h2><p>${c}</p></div>`).join('')}<h2>掌握门槛</h2><p>练习全部通过；隔一天不看答案重写；能解释一个边界情况；能主动设计一个新测试。每周留一次 45 分钟复盘，每四章参加一次考试，不按日历强行赶进度。</p><h2>项目验收表</h2><p>功能正确 40 分，测试与异常处理 25 分，结构与可读性 20 分，README 与演示 15 分。至少 80 分并能解释设计取舍，再考虑接入大模型或真实硬件。自动批改不能评估这些全部能力。</p><h2>官方资料</h2><p><a href="https://docs.python.org/zh-cn/3/tutorial/" target="_blank" rel="noopener">Python 官方教程</a> · <a href="https://fastapi.tiangolo.com/tutorial/" target="_blank" rel="noopener">FastAPI 教程</a> · <a href="https://docs.python.org/3/library/asyncio.html" target="_blank" rel="noopener">asyncio</a></p>`;}
else if(page==='exam'){html='<div class="eyebrow">每四章一次 · 复习与检验</div><h1>检验理解，而不只是记忆。</h1><p>每场 30 分钟，两道综合复测题，各占 50 分。80 分为建议通过线。题目来自所学练习，是自测复习，不是防作弊考试。请不查看参考答案；计时开始后关闭页面仍继续。</p>'+[0,1,2].map(n=>{let e=state.exams[n];return `<section class="card"><h2>阶段 ${n+1} · 第 ${n*4+1}–${n*4+4} 章</h2>${e?`<p>状态：${Date.now()<e.end?'进行中':'已结束'} · 成绩 ${Math.round(((state.scores[`e${n}-0`]||0)+(state.scores[`e${n}-1`]||0))/2)} / 100</p><p class="countdown" data-end="${e.end}"></p>`:''}<button data-exam="${n}">${e?'重新开始（重置本场成绩）':'开始考试'}</button>${e?examTasks(n).map(t=>taskHTML(t,t.id,true)).join(''):''}</section>`}).join('');}
else {let i=Number(page),c=course[i];html=`<div class="eyebrow">CHAPTER ${String(i+1).padStart(2,'0')} / 12</div><h1>${c.title}</h1><div class="note">本次目标：读懂示例，独立完成两个练习，并口头解释返回值与边界情况。建议分 3–5 次短时段完成。</div><section class="card"><h2>理解概念</h2>${c.body.split('。').filter(Boolean).map(x=>`<p>${esc(x)}。</p>`).join('')}<h3>读代码，先预测结果</h3><pre>${esc(c.example)}</pre><p>动手改变一个输入，预测结果是否改变。把 C++ 中的类型声明、花括号与这里的名字绑定、缩进做对照。</p><button data-read="${i}">${state.read[i]?'已标记阅读完成 ✓':'标记阅读完成'}</button></section>${c.tasks.map(t=>taskHTML(t)).join('')}<div class="card"><h3>离开前，回答三个问题</h3><p>这段程序接收什么、返回什么？空输入或边界输入会怎样？如果不用参考答案，你能解释每一行吗？</p><textarea data-key="note-${i}" aria-label="章节复盘" placeholder="写下你的理解、错误原因与明天要重做的题…">${esc(state.answers[`note-${i}`]||'')}</textarea></div><button data-page="${i<11?i+1:'exam'}">${i<11?'下一章 →':'参加阶段考试 →'}</button>`;}$('#view').innerHTML=html;tick();}
function tick(){document.querySelectorAll('.countdown').forEach(el=>{let s=Math.max(0,Math.ceil((Number(el.dataset.end)-Date.now())/1000));el.textContent=s?`剩余 ${Math.floor(s/60)} 分 ${s%60} 秒`:'时间到，已锁定本场提交。未提交题按 0 分计。';});}
async function run(key){if(busy)return;let exam=key.startsWith('e'),n=exam?Number(key[1]):null;if(exam&&(!state.exams[n]||Date.now()>=state.exams[n].end)){alert('考试已结束。可重新开始。');return;}let t=exam?examTasks(n).find(t=>t.id===key):course.flatMap(c=>c.tasks).find(t=>t.id===key);const code=state.answers[key]??t.starter;let el=$('#r-'+key);busy=true;clearTimeout(idle);document.querySelectorAll('.run').forEach(b=>b.disabled=true);el.textContent='正在准备 Python。首次需要联网下载运行环境，请稍候…';if(!worker)worker=new Worker(URL.createObjectURL(new Blob(["let py;\nonmessage=async({data:d})=>{try{if(!py){importScripts('https://cdn.jsdelivr.net/pyodide/v0.29.2/full/pyodide.js');py=await loadPyodide();}postMessage({ready:true});py.globals.set('payload',JSON.stringify(d));let result=await py.runPythonAsync(`\nimport json, io, contextlib\n_data=json.loads(payload)\n_results=[]\nfor _arg,_expected in _data['cases']:\n    try:\n        _ns={}\n        with contextlib.redirect_stdout(io.StringIO()):\n            exec(_data['code'],_ns)\n            _actual=_ns['solve'](_arg)\n        _actual=json.loads(json.dumps(_actual))\n        _results.append({'ok':_actual==_expected,'detail':str(_actual)[:400],'expected':str(_expected)[:400]})\n    except Exception as e:\n        _results.append({'ok':False,'detail':type(e).__name__+': '+str(e)[:400],'expected':str(_expected)[:400]})\njson.dumps(_results)\n`);postMessage({results:JSON.parse(result)});}catch(e){postMessage({error:String(e)})}};\n"],{type:'text/javascript'})));watchdog=setTimeout(()=>{stop();el.textContent='加载或运行超时，已释放运行器。请检查网络或循环后重试。';},90000);worker.onmessage=({data:d})=>{if(d.ready){clearTimeout(watchdog);watchdog=setTimeout(()=>{stop();el.textContent='运行超过 5 秒，已停止。请检查无限循环。';},5000);return;}clearTimeout(watchdog);busy=false;document.querySelectorAll('.run').forEach(b=>b.disabled=false);if(d.error)el.textContent='运行器加载失败：'+d.error+'\n请检查网络后重试。';else{let score=Math.round(100*d.results.filter(x=>x.ok).length/d.results.length);if(!exam||Date.now()<state.exams[n].end){state.scores[key]=score;save();el.textContent=`${score}% · ${d.results.filter(x=>x.ok).length}/${d.results.length} 个测试通过\n`+d.results.map((r,i)=>`${r.ok?'✓':'✗'} 测试 ${i+1}：得到 ${r.detail}；期望 ${r.expected}`).join('\n');}else el.textContent='提交运行期间考试已到时，本次不计分。';}idle=setTimeout(stop,30000);};worker.onerror=()=>{stop();el.textContent='运行环境错误，请重试。';};worker.postMessage({code,cases:t.cases});}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page!==undefined)go(b.dataset.page);if(b.dataset.read!==undefined){state.read[b.dataset.read]=true;save();render();}if(b.dataset.run)run(b.dataset.run);if(b.dataset.stop){stop();$('#r-'+b.dataset.stop).textContent='已停止，答案保留。';}if(b.dataset.exam!==undefined){let n=b.dataset.exam;if(state.exams[n]&&!confirm('重新计时并清除本场作答和成绩？'))return;state.exams[n]={end:Date.now()+30*60000};for(let i=0;i<2;i++){delete state.scores[`e${n}-${i}`];delete state.answers[`e${n}-${i}`];}save();render();}});
document.addEventListener('input',e=>{if(e.target.dataset.key){state.answers[e.target.dataset.key]=e.target.value;save();}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'&&e.key==='Tab'){e.preventDefault();let t=e.target;t.setRangeText('    ',t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}));}});
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='知序学习备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
$('#import').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>2e6)throw Error('文件超过 2 MB');let v=JSON.parse(await f.text());if(!v.answers||!v.scores||!v.read||!v.exams||Object.values(v.answers).some(x=>typeof x!=='string')||Object.values(v.scores).some(x=>typeof x!=='number'||x<0||x>100))throw Error('备份格式无效');if(confirm('用备份替换当前学习记录？')){stop();state=v;save();render();}}catch(err){alert('导入失败：'+err.message);}};
setInterval(tick,1000);Promise.resolve([{"title": "变量与表达式", "body": "Python 用缩进组织代码，不需要分号。变量是对象的名字，不必先声明类型。整数可以直接运算，/ 得到浮点数，// 向下取整，% 求余。字符串不能直接与数字相加。函数用 def 定义，return 返回计算结果；print 只用于显示。先预测结果，再运行验证。", "example": "x = 7\nprint(x / 2, x // 2, x % 2)\n# 3.5 3 1", "tasks": [{"id": "1-1", "prompt": "摄氏转华氏", "arg": "c", "starter": "def solve(c):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[-40, -40], [0, 32], [100, 212]], "solution": "def solve(c):\n    return c * 9 / 5 + 32\n"}, {"id": "1-2", "prompt": "分钟换算为 (小时, 分钟)", "arg": "n", "starter": "def solve(n):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[0, [0, 0]], [61, [1, 1]], [120, [2, 0]]], "solution": "def solve(n):\n    return divmod(n, 60)\n"}]}, {"title": "条件与循环", "body": "if / elif / else 从上到下选择第一个成立的分支。== 比较值，= 绑定名字。for 遍历对象；range 的右边界不包含在内。while 适合重复到某个条件满足，但必须让条件有机会改变。用累加器保存中间结果。空输入、零和负数是常见边界。", "example": "total = 0\nfor i in range(1, 5):\n    total += i\nprint(total) # 10", "tasks": [{"id": "2-1", "prompt": "计算 1 到 n 的和，n 为非负整数", "arg": "n", "starter": "def solve(n):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[0, 0], [1, 1], [10, 55]], "solution": "def solve(n):\n    return sum(range(1,n+1))\n"}, {"id": "2-2", "prompt": "判断整数是否为质数", "arg": "n", "starter": "def solve(n):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[1, false], [2, true], [9, false], [17, true]], "solution": "def solve(n):\n    return n >= 2 and all(n % i for i in range(2, int(n**0.5)+1))\n"}]}, {"title": "字符串与列表", "body": "字符串不可变，列表可变。索引从 0 开始，-1 表示最后一个元素。切片 a[start:stop:step] 不包含 stop。strip 去掉两端空白，split 按空白切分，join 连接字符串。列表 append 原地修改并返回 None。不要在遍历列表时随意删除元素，通常构造新列表更清楚。", "example": "words = \"  hello python  \".split()\nprint(\"-\".join(words))\nprint([x*x for x in range(4)])", "tasks": [{"id": "3-1", "prompt": "忽略大小写和所有空白，判断回文", "arg": "s", "starter": "def solve(s):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [["A b a", true], ["abc", false], ["", true]], "solution": "def solve(s):\n    s=\"\".join(s.lower().split())\n    return s == s[::-1]\n"}, {"id": "3-2", "prompt": "列表中所有偶数，保留原顺序", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], []], [[1, 2, 4], [2, 4]], [[-2, 3], [-2]]], "solution": "def solve(xs):\n    return [x for x in xs if x % 2 == 0]\n"}]}, {"title": "字典与集合", "body": "字典把键映射到值，适合计数和索引；集合用于去重和成员判断。字典的键必须可哈希，列表不能作键，整数和字符串可以。get(key, default) 可以处理缺失键。集合不提供业务顺序；若要保留首次出现顺序，维护结果列表与 seen 集合。", "example": "counts = {}\nfor word in [\"a\", \"b\", \"a\"]:\n    counts[word] = counts.get(word, 0) + 1\nprint(counts)", "tasks": [{"id": "4-1", "prompt": "统计列表中字符串出现次数", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], {}], [["a", "a", "b"], {"a": 2, "b": 1}], [["中"], {"中": 1}]], "solution": "def solve(xs):\n    d={}\n    for x in xs:\n        d[x]=d.get(x,0)+1\n    return d\n"}, {"id": "4-2", "prompt": "去重并保留首次出现顺序", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], []], [[3, 1, 3, 2], [3, 1, 2]], [[1, 1], [1]]], "solution": "def solve(xs):\n    return list(dict.fromkeys(xs))\n"}]}, {"title": "函数与可变对象", "body": "函数应该有清晰的输入、输出和约定。参数名在函数内绑定对象；修改传入列表会影响调用者。默认参数只在定义时创建一次，因此不要使用 [] 作为可变默认值，应使用 None。类型注解帮助阅读，不会自动检查运行时类型。把复杂逻辑拆成能独立测试的小函数。", "example": "def add_item(item, items=None):\n    if items is None:\n        items = []\n    return items + [item]", "tasks": [{"id": "5-1", "prompt": "把列表每个元素加一，返回新列表", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], []], [[1, 2], [2, 3]], [[-1], [0]]], "solution": "def solve(xs):\n    return [x+1 for x in xs]\n"}, {"id": "5-2", "prompt": "返回非空数值列表平均值；空列表返回 None", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], null], [[1, 3], 2], [[0], 0]], "solution": "def solve(xs):\n    return sum(xs)/len(xs) if xs else None\n"}]}, {"title": "异常、文件与 JSON", "body": "异常让失败与正常结果分开。try 包住可能失败的操作，只捕获能处理的异常；不要用裸 except 掩盖程序错误。with open(path, encoding=\"utf-8\") 自动关闭文件。JSON 是数据交换格式：对象对应 dict，数组对应 list，null 对应 None。loads 从字符串读取，dumps 转成字符串。浏览器文件属于临时运行环境，不是 Mac 硬盘。", "example": "import json\ndata = json.loads('{\"score\": 90}')\nprint(data[\"score\"])", "tasks": [{"id": "6-1", "prompt": "字符串转整数；无效字符串返回 None", "arg": "s", "starter": "def solve(s):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [["42", 42], ["x", null], ["-2", -2]], "solution": "def solve(s):\n    try:\n        return int(s)\n    except ValueError:\n        return None\n"}, {"id": "6-2", "prompt": "解析 JSON 数值数组并求和，输入保证合法", "arg": "s", "starter": "def solve(s):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [["[]", 0], ["[1,2,3]", 6], ["[-1,1]", 0]], "solution": "def solve(s):\n    import json\n    return sum(json.loads(s))\n"}]}, {"title": "类、模块与工程组织", "body": "类把状态与操作放在一起。__init__ 初始化实例，self 指当前实例。不要把每个实例独有的可变数据写成类属性。模块是一个 .py 文件，import 导入模块。实际项目用 venv 隔离依赖，用 python -m pip 安装；在 requirements 中记录版本，用 Git 记录修改。先写小模块，再引入框架。", "example": "class Counter:\n    def __init__(self):\n        self.value = 0\n    def add(self):\n        self.value += 1", "tasks": [{"id": "7-1", "prompt": "用内部 Counter 类累计 n 次，返回 value；n 非负", "arg": "n", "starter": "def solve(n):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[0, 0], [3, 3], [8, 8]], "solution": "def solve(n):\n    class Counter:\n        def __init__(self): self.value=0\n        def add(self): self.value+=1\n    c=Counter()\n    for _ in range(n): c.add()\n    return c.value\n"}, {"id": "7-2", "prompt": "按学生字典的 score 降序排序，同分保持原顺序", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], []], [[{"score": 2}, {"score": 5}], [{"score": 5}, {"score": 2}]]], "solution": "def solve(xs):\n    return sorted(xs, key=lambda x:x[\"score\"], reverse=True)\n"}]}, {"title": "基础数据结构与算法", "body": "先掌握列表、哈希表、栈和队列。栈后进先出，适合括号匹配；队列先进先出，适合任务调度，可用 collections.deque。O(n) 表示工作量随输入规模线性增长；双重完整遍历常为 O(n²)。二分查找要求有序数组，每次排除一半，时间复杂度 O(log n)。测试正确性不能证明复杂度，需要说明循环次数。", "example": "from collections import deque\nqueue = deque([\"a\", \"b\"])\nqueue.append(\"c\")\nprint(queue.popleft())", "tasks": [{"id": "8-1", "prompt": "判断只包含 () 的字符串是否配对", "arg": "s", "starter": "def solve(s):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [["", true], ["(())", true], [")(", false], ["(()", false]], "solution": "def solve(s):\n    n=0\n    for c in s:\n        n += 1 if c==\"(\" else -1\n        if n<0: return False\n    return n==0\n"}, {"id": "8-2", "prompt": "有序不重复整数列表中查找 3，返回索引，不存在返回 -1；练习二分", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], -1], [[1, 3, 5], 1], [[4, 5], -1]], "solution": "def solve(xs):\n    lo,hi=0,len(xs)-1\n    while lo<=hi:\n        mid=(lo+hi)//2\n        if xs[mid]==3: return mid\n        if xs[mid]<3: lo=mid+1\n        else: hi=mid-1\n    return -1\n"}]}, {"title": "HTTP 与接口开发", "body": "浏览器和服务通过 HTTP 交换请求与响应。GET 常用于读取，POST 常用于创建。路径、查询参数和 JSON 请求体承担不同职责。200 表示成功，404 表示资源不存在；服务端必须验证输入。Python 常用 requests/httpx 作客户端，FastAPI 构建接口。网络会超时，真实调用必须设置 timeout，并检查响应状态；本章练习用本地数据模拟业务逻辑。", "example": "from urllib.parse import urlencode\nprint(urlencode({\"q\": \"python basics\"}))\n# q=python+basics", "tasks": [{"id": "9-1", "prompt": "从用户字典列表中找 id 为 2 的用户；找不到返回 None", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], null], [[{"id": 1}], null], [[{"id": 2, "name": "Li"}], {"id": 2, "name": "Li"}]], "solution": "def solve(xs):\n    return next((x for x in xs if x[\"id\"]==2),None)\n"}, {"id": "9-2", "prompt": "把非负整数页码转换成偏移量，每页 20 条，页码从 1 开始；小于 1 返回 0", "arg": "page", "starter": "def solve(page):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[0, 0], [1, 0], [3, 40]], "solution": "def solve(page):\n    return max(0,page-1)*20\n"}]}, {"title": "数据库与测试", "body": "关系数据库把数据存入表。主键标识行，SELECT 查询，INSERT 插入，UPDATE 更新，DELETE 删除。WHERE 过滤，ORDER BY 排序。SQL 参数使用占位符，不能把用户输入直接拼接进语句。事务把多个更新视为整体。测试采用准备数据、执行操作、断言结果的结构，覆盖正常、边界与错误情况。下面练习关系数据的查询思维；完整数据库项目需在后续本地环境实现。", "example": "import sqlite3\ncon = sqlite3.connect(\":memory:\")\ncon.execute(\"CREATE TABLE scores(name TEXT, score INTEGER)\")\ncon.execute(\"INSERT INTO scores VALUES (?, ?)\", (\"Li\", 90))\nprint(con.execute(\"SELECT * FROM scores\").fetchall())", "tasks": [{"id": "10-1", "prompt": "筛选 score >= 60 的记录并返回 name 列表", "arg": "rows", "starter": "def solve(rows):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], []], [[{"name": "A", "score": 60}, {"name": "B", "score": 59}], ["A"]]], "solution": "def solve(rows):\n    return [r[\"name\"] for r in rows if r[\"score\"]>=60]\n"}, {"id": "10-2", "prompt": "返回数值列表的 (最小值, 最大值)，空列表返回 None", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], null], [[3, 1, 5], [1, 5]], [[-2], [-2, -2]]], "solution": "def solve(xs):\n    return (min(xs),max(xs)) if xs else None\n"}]}, {"title": "迭代器与异步", "body": "生成器用 yield 按需产生元素，避免一次构造大列表。迭代器会被消费，重复遍历时可能已耗尽。async def 定义协程，await 等待可等待对象；asyncio.gather 可并发等待多个 I/O 操作。异步不等于 CPU 计算自动加速；在协程里调用 time.sleep 会阻塞事件循环。先理解同步程序，再在网络等待成为瓶颈时引入并发。", "example": "def squares(n):\n    for i in range(n):\n        yield i*i\nprint(list(squares(4)))", "tasks": [{"id": "11-1", "prompt": "用生成器产生前 n 个平方数，再返回列表", "arg": "n", "starter": "def solve(n):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[0, []], [1, [0]], [4, [0, 1, 4, 9]]], "solution": "def solve(n):\n    return list(i*i for i in range(n))\n"}, {"id": "11-2", "prompt": "将列表按每组最多 3 个分块", "arg": "xs", "starter": "def solve(xs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], []], [[1, 2], [[1, 2]]], [[1, 2, 3, 4], [[1, 2, 3], [4]]]], "solution": "def solve(xs):\n    return [xs[i:i+3] for i in range(0,len(xs),3)]\n"}]}, {"title": "智能教师与机器人起步", "body": "智能教师先实现确定性的判分、错题记录和复习计划，再接入模型。模型输出可能错误，需要独立标准答案与评测集。机器人先在网格模拟中表示位置和动作，再学传感器、坐标系、ROS 2 与控制。控制指令必须验证边界。两个方向都需要日志、测试和可复现的数据。以下是项目核心函数，之后把它们组合成完整应用。", "example": "position = [0, 0]\nfor command in [\"R\", \"U\"]:\n    if command == \"R\": position[0] += 1\n    if command == \"U\": position[1] += 1\nprint(position)", "tasks": [{"id": "12-1", "prompt": "输入 (标准答案, 学生答案) 的列表，返回完全相等的题数", "arg": "pairs", "starter": "def solve(pairs):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [[[], 0], [[["a", "a"], ["b", "c"]], 1]], "solution": "def solve(pairs):\n    return sum(a==b for a,b in pairs)\n"}, {"id": "12-2", "prompt": "机器人从 (0,0) 出发，R/L 改变 x，U/D 改变 y；输入仅这些字符", "arg": "s", "starter": "def solve(s):\n    # 在这里编写代码，使用 return 返回结果\n    pass\n", "cases": [["", [0, 0]], ["RRULD", [1, 0]], ["UU", [0, 2]]], "solution": "def solve(s):\n    x=y=0\n    for c in s:\n        x += (c==\"R\")-(c==\"L\")\n        y += (c==\"U\")-(c==\"D\")\n    return (x,y)\n"}]}]).then(c=>{course=c;render()}).catch(()=>{$('#view').textContent='课程加载失败，请刷新页面。'});
